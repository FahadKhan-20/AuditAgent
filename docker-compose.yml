version: "3.8"

services:
  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    container_name: auditagent-backend
    ports:
      - "8000:8000"
    environment:
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - FORK_RPC_URL=${FORK_RPC_URL:-https://eth.llamarpc.com}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - PORT=8000
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: auditagent-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - agent
    restart: unless-stopped
